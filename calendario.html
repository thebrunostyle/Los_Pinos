<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calendario — Eventara</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0D1117;--ink2:#161C26;--gold:#C9A84C;--cream:#F5EDD6;--cream2:#EDE0C4;--muted:#8A7E6A;--nav-bg:rgba(13,17,23,.92);--input-bg:rgba(13,17,23,.8)}
[data-theme="light"]{--ink:#FAFAF5;--ink2:#F0E8D2;--cream:#1A1209;--cream2:#2D2416;--muted:#6B5E4A;--nav-bg:rgba(250,250,245,.94);--input-bg:rgba(250,250,245,.9)}
body{background:var(--ink);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:300}
a{text-decoration:none;color:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 4rem;background:var(--nav-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,.12)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;letter-spacing:.08em}
.nav-logo span{color:var(--gold)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:var(--muted);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;transition:color .3s}
.nav-links a:hover{color:var(--gold)}

main{padding:7rem 4rem 5rem}
.page-header{text-align:center;margin-bottom:3rem}
.page-tag{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3.5rem);font-weight:300}
.page-title em{font-style:italic;color:var(--gold)}
.page-line{width:60px;height:1px;background:var(--gold);margin:1.5rem auto 0}

.calendar-wrap{max-width:900px;margin:0 auto}
.cal-box{background:var(--ink2);border:1px solid rgba(201,168,76,.12);padding:2rem}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
.cal-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300}
.cal-nav{display:flex;gap:.5rem}
.cal-btn{background:transparent;border:1px solid rgba(201,168,76,.2);color:var(--cream);width:36px;height:36px;cursor:pointer;font-size:1rem;transition:all .3s;display:flex;align-items:center;justify-content:center}
.cal-btn:hover{border-color:var(--gold);color:var(--gold)}
.cal-days-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.cal-day-name{text-align:center;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:.6rem 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;position:relative;transition:all .2s;border:1px solid transparent}
.cal-cell.clickable{cursor:pointer}
.cal-cell.clickable:hover{background:rgba(201,168,76,.07)}
.cal-cell.empty{opacity:.2;pointer-events:none}
.cal-cell.today{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.3);color:var(--gold);font-weight:500}
.cal-dot{width:6px;height:6px;border-radius:50%;position:absolute;bottom:4px}
.legend{display:flex;gap:1.5rem;margin-top:1.5rem;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.detail-box{background:var(--ink);border:1px solid rgba(201,168,76,.2);padding:1.5rem;margin-top:1rem;animation:fadeUp .3s ease}
.detail-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;margin-bottom:.8rem}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.2rem}
.detail-item{font-size:.8rem;color:var(--muted)}
.detail-item span{color:var(--cream)}
.btn-gold{background:var(--gold);color:var(--ink);padding:.65rem 1.6rem;font-size:.78rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:inline-block;border:none;cursor:pointer;transition:background .3s}
.btn-gold:hover{background:#E2C97E}
.loading{text-align:center;padding:2rem;color:var(--muted);font-style:italic}

/* Theme Toggle */
.theme-toggle{background:transparent;border:1px solid rgba(201,168,76,.25);color:var(--cream);width:34px;height:34px;cursor:pointer;font-size:.95rem;transition:all .3s;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0}
.theme-toggle:hover{border-color:var(--gold)}
.theme-toggle::after{content:'🌙'}
[data-theme="dark"] .theme-toggle::after{content:'☀️'}

/* WA Float */
.wa-float{position:fixed;bottom:2rem;right:2rem;z-index:200;width:54px;height:54px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.3);transition:transform .3s}
.wa-float:hover{transform:scale(1.1)}
.wa-float svg{width:28px;height:28px;fill:white}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Event<span>ara</span></a>
  <ul class="nav-links">
    <li><a href="index.html#inicio">Inicio</a></li>
    <li><a href="index.html#servicios">Servicios</a></li>
    <li><a href="calendario.html" style="color:var(--gold)">Calendario</a></li>
    <li><a href="registro.html">Registro</a></li>
    <li><a href="index.html#contacto">Contacto</a></li>
  </ul>
  <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema"></button>
</nav>

<main>
  <div class="page-header">
    <div class="page-tag">Disponibilidad</div>
    <h1 class="page-title">Elige tu <em>fecha ideal</em></h1>
    <div class="page-line"></div>
  </div>

  <div class="calendar-wrap">
    <div class="cal-box">
      <div class="cal-header">
        <div class="cal-title" id="calTitle">Cargando...</div>
        <div class="cal-nav">
          <button class="cal-btn" onclick="changeMonth(-1)">←</button>
          <button class="cal-btn" onclick="changeMonth(1)">→</button>
        </div>
      </div>
      <div class="cal-days-hdr">
        <div class="cal-day-name">Dom</div><div class="cal-day-name">Lun</div>
        <div class="cal-day-name">Mar</div><div class="cal-day-name">Mié</div>
        <div class="cal-day-name">Jue</div><div class="cal-day-name">Vie</div>
        <div class="cal-day-name">Sáb</div>
      </div>
      <div id="loading" class="loading">Consultando disponibilidad...</div>
      <div class="cal-grid" id="calGrid" style="display:none"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Disponible</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div>Ocupado</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>Pendiente</div>
        <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>Programado</div>
      </div>
      <div id="calDetail" style="display:none"></div>
    </div>
  </div>
</main>

<a class="wa-float" href="https://wa.me/573001234567?text=Hola%2C%20deseo%20informaci%C3%B3n%20sobre%20eventos." target="_blank">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.136.562 4.14 1.535 5.876L.057 23.617a.75.75 0 00.918.899l5.9-1.547A11.952 11.952 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.673-.497-5.217-1.369l-.374-.216-3.878 1.017 1.035-3.783-.234-.381A9.953 9.953 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
</a>

<script>
// ── TEMA ──
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('eventara-theme', next);
}
(function(){
  const saved = localStorage.getItem('eventara-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();

// ── DATOS DEMO (se usan cuando la API no está disponible) ──
const DEMO = [
  {fecha:'2026-06-07', nombre:'Conferencia Tech 2026',   estado:'ocupado',    hora_inicio:'09:00', hora_fin:'18:00', responsable:'Laura Torres'},
  {fecha:'2026-06-12', nombre:'Gala Corporativa',        estado:'programado', hora_inicio:'19:00', hora_fin:'23:00', responsable:'Mario Ruiz'},
  {fecha:'2026-06-14', nombre:'Boda García-López',       estado:'pendiente',  hora_inicio:'16:00', hora_fin:'22:00', responsable:'Ana García'},
  {fecha:'2026-06-19', nombre:'Disponible para reserva', estado:'disponible', hora_inicio:'—',     hora_fin:'—',     responsable:'—'},
  {fecha:'2026-06-20', nombre:'Workshop Innovación',     estado:'programado', hora_inicio:'08:00', hora_fin:'17:00', responsable:'Pedro Mora'},
  {fecha:'2026-06-21', nombre:'Congreso Salud',          estado:'ocupado',    hora_inicio:'07:00', hora_fin:'20:00', responsable:'Dr. Herrera'},
  {fecha:'2026-06-25', nombre:'Disponible para reserva', estado:'disponible', hora_inicio:'—',     hora_fin:'—',     responsable:'—'},
  {fecha:'2026-06-26', nombre:'Cumpleaños Empresarial',  estado:'pendiente',  hora_inicio:'18:00', hora_fin:'23:00', responsable:'Sofía León'},
  {fecha:'2026-07-04', nombre:'Feria Comercial',         estado:'programado', hora_inicio:'09:00', hora_fin:'19:00', responsable:'Roberto Silva'},
  {fecha:'2026-07-10', nombre:'Seminario Marketing',     estado:'ocupado',    hora_inicio:'08:00', hora_fin:'17:00', responsable:'Diana Pérez'},
  {fecha:'2026-07-18', nombre:'Disponible para reserva', estado:'disponible', hora_inicio:'—',     hora_fin:'—',     responsable:'—'},
];

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
               'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COLORES = { ocupado:'#f87171', pendiente:'#fbbf24', programado:'#60a5fa', disponible:'#4ade80' };

let year  = new Date().getFullYear();
let month = new Date().getMonth() + 1;
let itemsByDate = {};

function loadCalendar() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('calGrid').style.display  = 'none';
  document.getElementById('calDetail').style.display= 'none';
  document.getElementById('calTitle').textContent   = MESES[month-1] + ' ' + year;

  itemsByDate = {};
  DEMO.forEach(i => { itemsByDate[i.fecha] = i; });

  renderGrid();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('calGrid').style.display  = 'grid';
}

function renderGrid() {
  const grid    = document.getElementById('calGrid');
  const hoy     = new Date();
  const primero = new Date(year, month-1, 1).getDay();
  const dias    = new Date(year, month, 0).getDate();
  grid.innerHTML = '';

  for (let i=0; i<primero; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  for (let d=1; d<=dias; d++) {
    const key    = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev     = itemsByDate[key];
    const isHoy  = hoy.getFullYear()===year && hoy.getMonth()===month-1 && hoy.getDate()===d;
    const el     = document.createElement('div');
    el.className = 'cal-cell' + (ev ? ' clickable' : '') + (isHoy ? ' today' : '');
    el.textContent = d;
    if (ev) {
      const dot = document.createElement('span');
      dot.className = 'cal-dot';
      dot.style.background = COLORES[ev.estado] || COLORES.disponible;
      el.appendChild(dot);
      el.onclick = () => showDetail(ev);
    }
    grid.appendChild(el);
  }
}

function showDetail(ev) {
  const box = document.getElementById('calDetail');
  box.style.display = 'none';
  setTimeout(() => {
    box.innerHTML = `
      <div class="detail-box">
        <div class="detail-title">${ev.nombre}</div>
        <div class="detail-grid">
          <div class="detail-item">Fecha: <span>${ev.fecha}</span></div>
          <div class="detail-item">Estado: <span>${ev.estado}</span></div>
          <div class="detail-item">Inicio: <span>${ev.hora_inicio}</span></div>
          <div class="detail-item">Fin: <span>${ev.hora_fin}</span></div>
          <div class="detail-item">Responsable: <span>${ev.responsable}</span></div>
        </div>
        ${ev.estado==='disponible' ? '<a href="registro.html" class="btn-gold">Solicitar esta fecha</a>' : ''}
      </div>`;
    box.style.display = 'block';
  }, 50);
}

function changeMonth(dir) {
  month += dir;
  if (month > 12) { month = 1; year++; }
  if (month < 1)  { month = 12; year--; }
  loadCalendar();
}

loadCalendar();
</script>
</body>
</html>
